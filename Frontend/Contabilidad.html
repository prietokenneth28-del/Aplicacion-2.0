<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contabilidad - Taller Mecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./CSS/finance-theme.css">
</head>

<body>
        <nav class="navbar navbar-expand-lg navbar-custom sticky-top mb-4">
            <div class="container-fluid container-main"> <a class="navbar-brand" href="Contabilidad.html">
                    <img src="./logo.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
                    Rogers Prieto
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                        data-bs-target="#navbarMain" aria-controls="navbarMain" 
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarMain">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="Control.html">
                                <i class="bi bi-clipboard-data nav-icon"></i>Control
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Factura.html">
                                <i class="bi bi-receipt nav-icon"></i>Facturación
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Clientes.html">
                                <i class="bi bi-people-fill nav-icon"></i>Clientes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Contabilidad.html">
                                <i class="bi bi-graph-up-arrow nav-icon"></i>Contabilidad
                            </a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-3">
                        <div class="d-none d-lg-block text-end me-2">
                            <small class="d-block text-muted" style="font-size: 0.75rem;">Bienvenido</small>
                            <span class="text-light fw-medium" style="font-size: 0.9rem;">Administrador</span>
                        </div>
                        <button class="btn-logout-nav" id="BtnLogout">
                            <i class="bi bi-box-arrow-right me-1"></i> Salir
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    <div class="finance-container">


        <main>
            <div class="kpi-grid mb-4">
                <div class="kpi-card">
                    <h5 class="text-info"><i class="bi bi-droplet-fill me-2"></i>Total Insumos</h5>
                    <div class="value" id="lblTotalInsumos">$ 0</div>
                </div>
                
                <div class="kpi-card">
                    <h5 class="text-success"><i class="bi bi-person-check-fill me-2"></i>Total Omar</h5>
                    <div class="value" id="lblTotalOmar">$ 0</div>
                </div>
                
                <div class="kpi-card">
                    <h5 class="text-warning"><i class="bi bi-person-check-fill me-2"></i>Total Rogers</h5>
                    <div class="value" id="lblTotalRogers">$ 0</div>
                </div>
            </div>

            <div class="finance-card mb-4">
                <div class="finance-card-header">
                    <h3><i class="bi bi-funnel me-2"></i>Rango de Fechas</h3>
                </div>
                <div class="p-4">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label-enhanced">Desde</label>
                            <input type="date" id="fechaDesde" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label-enhanced">Hasta</label>
                            <input type="date" id="fechaHasta" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label-enhanced">Filtros Rápidos</label>
                            <select class="form-select" id="SelectFiltroFecha">
                                <option value="0">Personalizado</option>
                                <option value="Hoy">Hoy</option>
                                <option value="Ayer">Ayer</option>
                                <option value="Esta semana">Esta semana</option>
                                <option value="Semana pasada">Semana pasada</option>
                                <option value="Este mes">Este mes</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button class="btn-finance btn-finance-primary w-100" id="btnFiltrar">
                                <i class="bi bi-search me-2"></i>Aplicar Filtros
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="finance-card h-100">
                        <div class="finance-card-header">
                            <h3><i class="bi bi-list-check me-2"></i>Facturas Registradas</h3>
                        </div>
                        <div class="p-0">
                            <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                                <table class="finance-table table-hover">
                                    <thead class="sticky-top bg-dark">
                                        <tr>
                                            <th>#</th>
                                            <th>Fecha</th>
                                            <th>Rogers</th>
                                            <th>Insumos</th>
                                            <th>Omar</th>
                                            <th>Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaFacturas"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="finance-card h-100">
                        <div class="finance-card-header d-flex justify-content-between align-items-center">
                            <h3><i class="bi bi-box-seam me-2"></i>Detalle Insumos</h3>
                            <button class="btn btn-sm btn-outline-danger" id="btnExportarInsumosPDF">
                                <i class="bi bi-file-pdf"></i> PDF
                            </button>
                        </div>
                        <div class="p-0">
                            <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                                <table class="finance-table table-hover">
                                    <thead class="sticky-top bg-dark">
                                        <tr>
                                            <th>Fac. #</th>
                                            <th>Fecha</th>
                                            <th>Descripción</th>
                                            <th>Valor</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaInsumos"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="modalFactura" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title"><i class="bi bi-eye me-2"></i>Vista Previa</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detalleFactura">
                    </div>
                <div class="modal-footer border-top border-secondary">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button class="btn btn-warning" id="btnEditarFactura">Editar</button>
                    <button class="btn btn-danger" id="btnEliminarFactura">Eliminar</button>
                    <button class="btn btn-primary" id="btnVerPDF"><i class="bi bi-file-pdf"></i> PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "index.html";
        }
    </script>

    <script type="module" src="./JS/contabilidad.js"></script>
    <script type="module" src="./JS/helpers/logout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="module" src="./JS/ui/navbar.ui.js"></script>
</body>
</html>

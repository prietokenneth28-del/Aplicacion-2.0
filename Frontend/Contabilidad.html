<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contabilidad - Taller Mecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        :root {
            --financial-blue: #2c3e50;
            --profit-green: #27ae60;
            --expense-orange: #e67e22;
            --cash-purple: #9b59b6;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .finance-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header financiero */
        .finance-header {
            background: linear-gradient(135deg, var(--financial-blue) 0%, #34495e 100%);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .finance-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--profit-green), var(--cash-purple));
        }

        .finance-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .finance-logo .icon {
            width: 55px;
            height: 55px;
            background: rgba(39, 174, 96, 0.1);
            border: 1px solid rgba(39, 174, 96, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--profit-green);
        }

        .finance-logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(90deg, white, #bdc3c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .finance-logo small {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Tarjetas financieras */
        .finance-card {
            background: white;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .finance-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .finance-card-header {
            background: linear-gradient(135deg, var(--financial-blue) 0%, #34495e 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 20px 20px 0 0;
            border: none;
        }

        .finance-card-header h3 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin: 2rem 0;
        }

        .kpi-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            text-align: center;
            transition: all 0.3s ease;
            border-top: 4px solid;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            opacity: 0.8;
        }

        .kpi-card.insumos {
            border-top-color: var(--expense-orange);
        }

        .kpi-card.omar {
            border-top-color: var(--profit-green);
        }

        .kpi-card.rogers {
            border-top-color: var(--cash-purple);
        }

        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .kpi-card h5 {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .kpi-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--financial-blue);
        }

        /* Filtros mejorados */
        .filter-section {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .filter-section .form-control {
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .filter-section .form-control:focus {
            border-color: var(--profit-green);
            box-shadow: 0 0 0 0.25rem rgba(39, 174, 96, 0.15);
        }

        /* Tablas financieras */
        .finance-table {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .finance-table thead {
            background: linear-gradient(135deg, var(--financial-blue) 0%, #34495e 100%);
        }

        .finance-table thead th {
            color: white;
            padding: 1.2rem 1.5rem;
            border: none;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .finance-table tbody tr {
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .finance-table tbody tr:hover {
            background: rgba(52, 152, 219, 0.05);
        }

        .finance-table tbody td {
            padding: 1rem 1.5rem;
            vertical-align: middle;
        }

        /* Modal financiero */
        .finance-modal .modal-content {
            border-radius: 20px;
            border: none;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }

        .finance-modal .modal-header {
            background: linear-gradient(135deg, var(--financial-blue) 0%, #34495e 100%);
            color: white;
            border-radius: 20px 20px 0 0;
            border: none;
        }

        /* Botones financieros */
        .btn-finance {
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-finance-primary {
            background: linear-gradient(135deg, var(--financial-blue) 0%, #34495e 100%);
            color: white;
        }

        .btn-finance-success {
            background: linear-gradient(135deg, var(--profit-green) 0%, #2ecc71 100%);
            color: white;
        }

        .btn-finance-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .btn-finance:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* Gráfico de barras simple */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 100px;
            margin-top: 1rem;
        }

        .bar {
            flex: 1;
            background: linear-gradient(to top, var(--profit-green), #2ecc71);
            border-radius: 5px 5px 0 0;
            min-height: 20px;
            position: relative;
        }

        .bar::after {
            content: attr(data-label);
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .finance-container {
                padding: 15px;
            }
            
            .kpi-grid {
                grid-template-columns: 1fr;
            }
            
            .finance-header {
                padding: 1rem;
            }
        }

        /* Animaciones */
        @keyframes countUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .count-up {
            animation: countUp 0.8s ease-out;
        }
    </style>
</head>

<body>
    <div class="finance-container">
        <!-- Header -->
        <header class="finance-header count-up">
            <div class="d-flex justify-content-between align-items-center">
                <div class="finance-logo">
                    <div class="icon">
                        <i class="bi bi-coin"></i>
                    </div>
                    <div>
                        <h1>Contabilidad</h1>
                        <small>Análisis y reportes</small>
                    </div>
                </div>
                
                <div class="nav-finance">
                    <a class="btn-finance btn-finance-primary me-2" href="./Factura.html">
                        <i class="bi bi-tools"></i> Facturación
                    </a>
                    <a class="btn-finance btn-finance-primary me-2" href="./Control.html">
                        <i class="bi bi-file-earmark-bar-graph"></i> Control
                    </a>
                    <button class="btn-finance btn-finance-danger" id="BtnLogout">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </header>

        <!-- KPIs principales -->
        <div class="kpi-grid">
            <div class="kpi-card insumos">
                <h5>Total Insumos</h5>
                <div class="value" id="lblTotalInsumos">$ 0</div>
                <div class="bar-chart">
                    <div class="bar" style="height: 60%;" data-label="Actual"></div>
                    <div class="bar" style="height: 40%; background: linear-gradient(to top, #e67e22, #d35400);" 
                         data-label="Anterior"></div>
                </div>
            </div>
            
            <div class="kpi-card omar">
                <h5>Total Omar</h5>
                <div class="value" id="lblTotalOmar">$ 0</div>
                <div class="bar-chart">
                    <div class="bar" style="height: 75%;" data-label="Actual"></div>
                    <div class="bar" style="height: 55%; background: linear-gradient(to top, #27ae60, #2ecc71);" 
                         data-label="Anterior"></div>
                </div>
            </div>
            
            <div class="kpi-card rogers">
                <h5>Total Rogers</h5>
                <div class="value" id="lblTotalRogers">$ 0</div>
                <div class="bar-chart">
                    <div class="bar" style="height: 80%;" data-label="Actual"></div>
                    <div class="bar" style="height: 65%; background: linear-gradient(to top, #9b59b6, #8e44ad);" 
                         data-label="Anterior"></div>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="finance-card mb-4">
            <div class="finance-card-header">
                <h3><i class="bi bi-funnel"></i> Filtros de Búsqueda</h3>
            </div>
            <div class="p-4">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label>Desde</label>
                        <input type="date" id="fechaDesde" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label>Hasta</label>
                        <input type="date" id="fechaHasta" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label>Filtro de fecha</label>
                        <select class="form-control" id="SelectFiltroFecha">
                            <option value="0">Seleccione un filtro</option>
                            <option value="Hoy">Hoy</option>
                            <option value="Ayer">Ayer</option>
                            <option value="Esta semana">Esta semana</option>
                            <option value="Semana pasada">Semana pasada</option>
                            <option value="Este mes">Este mes</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn-finance btn-finance-primary w-100" id="btnFiltrar">
                            <i class="bi bi-search"></i> Filtrar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-3 ">
        <!-- Resumen de Facturas -->
        <div class="finance-card mb-4">
            <div class="col-md-6">
            <div class="finance-card-header">
                <h3><i class="bi bi-database-fill-check"></i> Resumen de Facturas</h3>
            </div>
            <div class="p-4">
                <div class="table-responsive">
                    <table class="finance-table">
                        <thead>
                            <tr>
                                <th>N° Factura</th>
                                <th>Fecha</th>
                                <th>Total Rogers</th>
                                <th>Total Insumos</th>
                                <th>Total Omar</th>
                            </tr>
                        </thead>
                        <tbody id="tablaFacturas"></tbody>
                    </table>
                </div>
            </div>
        </div>
        </div>

        <!-- Detalle de Insumos -->
         <div class="col-md-6">
        <div class="finance-card">
            <div class="finance-card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h3><i class="bi bi-file-earmark-spreadsheet-fill"></i> Detalle de Insumos</h3>
                    <button class="btn-finance btn-finance-danger" id="btnExportarInsumosPDF">
                        <i class="bi bi-file-earmark-pdf-fill"></i> Exportar PDF
                    </button>
                </div>
            </div>
            <div class="p-4">
                <div class="table-responsive">
                    <table class="finance-table">
                        <thead>
                            <tr>
                                <th>N° Factura</th>
                                <th>Fecha</th>
                                <th>Descripción</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody id="tablaInsumos"></tbody>
                    </table>
                </div>
            </div>
        </div>
        </div>
    </div>
    </div>
    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "index.html";
        }
    </script>

    <!-- Mantener todos los scripts originales -->
    <script type="module" src="./JS/contabilidad.js"></script>
    <script type="module" src="./JS/helpers/logout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Modal (mantener HTML original pero con nuevas clases) -->
    <div class="modal fade finance-modal" id="modalFactura" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalle de Factura</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detalleFactura">
                    <!-- Contenido dinámico -->
                </div>
                <div class="modal-footer">
                    <button class="btn-finance btn-finance-primary" data-bs-dismiss="modal">
                        Cerrar
                    </button>
                    <button class="btn-finance btn-finance-warning" id="btnEditarFactura">
                        Editar
                    </button>
                    <button class="btn-finance btn-finance-danger" id="btnEliminarFactura">
                        Eliminar
                    </button>
                    <button class="btn-finance btn-finance-success" id="btnVerPDF">
                        <i class="bi bi-file-earmark-pdf-fill"></i> Ver PDF
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

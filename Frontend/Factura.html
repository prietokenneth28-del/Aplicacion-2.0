<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Facturación - Taller Mecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        :root {
            --dark-primary: #1a1a2e;
            --dark-secondary: #16213e;
            --accent: #0fce7c;
            --purple: #6c5ce7;
            --pink: #fd79a8;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #f8f9fa;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .glass-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header estilo dark */
        .dark-header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .dark-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--purple));
        }

        .logo-dark {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-dark .icon {
            width: 55px;
            height: 55px;
            background: rgba(15, 206, 124, 0.1);
            border: 1px solid rgba(15, 206, 124, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--accent);
        }

        .logo-dark h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-dark small {
            font-size: 0.9rem;
            color: #95a5a6;
        }

        /* Navegación dark */
        .nav-dark .nav-link {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.9) !important;
            padding: 10px 20px !important;
            border-radius: 10px;
            margin: 0 5px;
            transition: all 0.3s ease;
        }

        .nav-dark .nav-link:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .nav-dark .logout-btn {
            background: rgba(253, 121, 168, 0.1);
            border-color: rgba(253, 121, 168, 0.3);
        }

        /* Tarjetas glass */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border-color: rgba(15, 206, 124, 0.3);
        }

        .glass-card-header {
            background: rgba(15, 206, 124, 0.2);
            border-bottom: 1px solid rgba(15, 206, 124, 0.3);
            padding: 1.5rem;
            border-radius: 20px 20px 0 0;
        }

        .glass-card-header h3 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Formularios dark */
        .form-control-dark {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control-dark:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(15, 206, 124, 0.15);
        }

        .form-control-dark::placeholder {
            color: rgba(255,255,255,0.5);
        }

        /* Botones dark */
        .btn-dark-accent {
            background: linear-gradient(135deg, var(--accent) 0%, #0db56f 100%);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-dark-accent:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(15, 206, 124, 0.3);
        }

        /* Tablas dark */
        .table-dark-glass {
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .table-dark-glass thead {
            background: linear-gradient(135deg, rgba(15, 206, 124, 0.3) 0%, rgba(108, 92, 231, 0.3) 100%);
        }

        .table-dark-glass thead th {
            color: white;
            border: none;
            padding: 1rem;
        }

        .table-dark-glass tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
        }

        .table-dark-glass tbody tr:hover {
            background: rgba(15, 206, 124, 0.1);
        }

        /* Grid de servicios */
        .services-grid-dark {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin: 2rem 0;
        }

        /* Totales dark */
        .summary-dark {
            background: linear-gradient(135deg, var(--purple) 0%, #5b4fcf 100%);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.3);
        }

        .summary-grid-dark {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .summary-item-dark {
            text-align: center;
            padding: 1.2rem;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .summary-item-dark h5 {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .summary-item-dark span {
            font-size: 1.8rem;
            font-weight: 700;
            display: block;
        }

        /* Switch personalizado */
        .form-switch .form-check-input {
            width: 3em;
            height: 1.5em;
            background-color: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .form-switch .form-check-input:checked {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        /* Animaciones */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .slide-in {
            animation: slideIn 0.5s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .glass-container {
                padding: 15px;
            }
            
            .services-grid-dark {
                grid-template-columns: 1fr;
            }
            
            .dark-header {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="glass-container">
        <!-- Header -->
        <header class="dark-header slide-in">
            <div class="d-flex justify-content-between align-items-center">
                <div class="logo-dark">
                    <div class="icon">
                        <i class="bi bi-tools"></i>
                    </div>
                    <div>
                        <h1>Sistema de Facturación</h1>
                        <small>Gestión profesional de facturas</small>
                    </div>
                </div>
                
                <div class="nav-dark">
                    <a class="nav-link" href="./Contabilidad.html">
                        <i class="bi bi-coin"></i> Contabilidad
                    </a>
                    <a class="nav-link" href="./Control.html">
                        <i class="bi bi-file-earmark-bar-graph"></i> Control
                    </a>
                    <button class="nav-link logout-btn" id="BtnLogout">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </header>

        <!-- Resto del contenido HTML original se mantiene -->
        <!-- Solo cambian las clases para aplicar el nuevo diseño -->
        
        <main class="slide-in">
            <!-- Sección Cliente -->
            <div class="glass-card mb-4">
                <div class="glass-card-header">
                    <h3><i class="bi bi-person-vcard"></i> Datos del Cliente</h3>
                </div>
                <div class="p-4">
                    <!-- Mantener todo el formulario original, solo cambiar clases -->
                    <form class="row g-3" id="FormInfomacionCliente" novalidate>
                        <!-- Todos los inputs originales con clases form-control-dark -->
                        <div class="col-12">
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-dark text-white">
                                    <i class="bi bi-car-front"></i>
                                </span>
                                <input type="text" class="form-control-dark" 
                                       placeholder="Ej: ABC 123" id="InputPlaca">
                                <button class="btn-dark-accent" type="button" id="BtnBuscarCliente">
                                    <i class="bi bi-search"></i> Buscar
                                </button>
                            </div>
                        </div>

                        <!-- Resto del formulario manteniendo IDs originales -->
                        <!-- Solo cambiar clases a form-control-dark -->
                    </form>
                </div>
            </div>

            <!-- Sección Factura -->
            <div class="glass-card mb-4">
                <div class="glass-card-header">
                    <h3><i class="bi bi-file-earmark-text"></i> Datos de la Factura</h3>
                </div>
                <div class="p-4">
                    <!-- Mantener formulario original, solo cambiar clases -->
                </div>
            </div>

            <!-- Grid de Servicios, Repuestos, Insumos -->
            <div class="services-grid-dark">
                <!-- Servicios -->
                <div class="glass-card">
                    <div class="glass-card-header">
                        <h5><i class="bi bi-tools"></i> Servicios</h5>
                    </div>
                    <div class="p-3">
                        <!-- Mantener formulario y tabla original -->
                    </div>
                </div>

                <!-- Repuestos -->
                <div class="glass-card">
                    <div class="glass-card-header" style="background: rgba(253, 121, 168, 0.2);">
                        <h5><i class="bi bi-gear"></i> Repuestos</h5>
                    </div>
                    <div class="p-3">
                        <!-- Mantener formulario y tabla original -->
                    </div>
                </div>

                <!-- Insumos -->
                <div class="glass-card">
                    <div class="glass-card-header" style="background: rgba(108, 92, 231, 0.2);">
                        <h5><i class="bi bi-droplet"></i> Insumos</h5>
                    </div>
                    <div class="p-3">
                        <!-- Mantener formulario y tabla original -->
                    </div>
                </div>
            </div>

            <!-- Totales -->
            <div class="summary-dark mt-4">
                <div class="summary-grid-dark">
                    <div class="summary-item-dark">
                        <h5>Total Servicios</h5>
                        <span id="totalServicios">$ 0.00</span>
                    </div>
                    <div class="summary-item-dark">
                        <h5>Total Repuestos</h5>
                        <span id="Total Repuestos">$ 0.00</span>
                    </div>
                    <div class="summary-item-dark">
                        <h5>Total Insumos</h5>
                        <span id="Total Insumos">$ 0.00</span>
                    </div>
                    <div class="summary-item-dark" style="grid-column: 1 / -1; background: rgba(255,255,255,0.2);">
                        <h5>Total General</h5>
                        <span id="total">$ 0.00</span>
                    </div>
                </div>
            </div>

            <!-- Botón Exportar PDF -->
            <div class="text-center mt-4">
                <button class="btn-dark-accent btn-lg" id="BtnExportarPDF">
                    <i class="bi bi-file-earmark-pdf-fill"></i> Exportar PDF
                </button>
            </div>
        </main>
    </div>

    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "index.html";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./JS/main.js"></script>
    <script type="module" src="./JS/helpers/logout.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso al sistema</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .card {
        border-radius: 20px;
        border: none;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .card-header {
        background: linear-gradient(90deg, #2c3e50 0%, #4a6491 100%);
        padding: 30px;
    }
    
    .form-control {
        border-radius: 10px;
        padding: 12px 20px;
        border: 2px solid #e1e5eb;
        transition: all 0.3s;
    }
    
    .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
    }
    
    .btn-primary {
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 12px;
        font-weight: 600;
        border-radius: 10px;
        transition: transform 0.3s;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    
    .card-footer {
        background: #f8f9fa;
        padding: 15px;
    }
                @media (max-width: 768px) {
                    .card {
                        margin: 10px;
                    }
                    
                    .navbar-brand h3 {
                        font-size: 1.2rem;
                    }
                }
</style>
</head>

<body class="bg-dark d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg border-0" style="width: 380px;">
        <div class="card-header text-center bg-primary text-white">
            <h4 class="mb-0">Sistema de Facturación</h4>
            <small>Inicio de sesión</small>
        </div>

        <div class="card-body p-4">

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input
                    type="text"
                    id="usuario"
                    class="form-control"
                    placeholder="Ingrese su usuario"
                    autocomplete="username"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Ingrese su contraseña"
                    autocomplete="current-password"
                >
            </div>

            <div id="errorMsg" class="alert alert-danger d-none"></div>

            <button
                class="btn btn-primary w-100"
                onclick="login()"
            >
                Ingresar
            </button>
        </div>

        <div class="card-footer text-center text-muted small">
            © 2026 Taller Mecánico
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>


        <script>
            const API_URL = "https://aplicacion-2-0.onrender.com";

            async function login() {
                const usuario = document.getElementById("usuario").value.trim();
                const password = document.getElementById("password").value.trim();
                const errorBox = document.getElementById("errorMsg");

                errorBox.classList.add("d-none");
                errorBox.innerText = "";

                if (!usuario || !password) {
                    errorBox.innerText = "Debe ingresar usuario y contraseña";
                    errorBox.classList.remove("d-none");
                    return;
                }

                try {
                    const res = await fetch(`${API_URL}/auth/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ usuario, password })
                    });

                    const data = await res.json();

                    if (!res.ok) {
                        throw new Error(data.message || "Error al iniciar sesión");
                    }

                    localStorage.setItem("token", data.token);
                    window.location.href = "Factura.html";

                } catch (error) {
                    errorBox.innerText = error.message;
                    errorBox.classList.remove("d-none");
                }
            }

            document.addEventListener("keydown", (e) => {
                if (e.key === "Enter") login();
            });
        </script>


</body>
</html>

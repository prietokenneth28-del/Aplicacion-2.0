<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control - Taller Mecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./CSS/finance-theme.css">
</head>

<body>
    <div class="finance-container">
        <header class="finance-header">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="finance-logo">
                    <div class="icon"><i class="bi bi-clipboard-data"></i></div>
                    <div>
                        <h1>Control de Taller</h1>
                        <small>Hoja de trabajo y seguimiento</small>
                    </div>
                </div>
                
                <div class="nav-finance">
                    <a class="btn-finance btn-finance-primary" href="./Factura.html">
                        <i class="bi bi-receipt"></i> Facturación
                    </a>
                    <a class="btn-finance btn-finance-primary" href="./Contabilidad.html">
                         <i class="bi bi-coin"></i> Contabilidad
                    </a>
                    <button class="btn-finance btn-finance-danger" id="BtnLogout">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </div>
            </div>
        </header>

        <main>
            <div class="finance-card">
                <div class="finance-card-header">
                    <h3><i class="bi bi-car-front-fill me-2"></i>Recepción del Vehículo</h3>
                </div>
                <div class="card-body-main">
                    <form class="row g-3" id="FormInfomacionCliente" novalidate>
                        <div class="col-12 mb-2">
                            <div class="row align-items-end">
                                <div class="col-md-4">
                                    <label class="form-label-enhanced">Placa del Vehículo</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-dark border-secondary"><i class="bi bi-search"></i></span>
                                        <input type="text" class="form-control" placeholder="ABC-123" id="InputPlaca">
                                        <button class="btn btn-primary" type="button" id="BtnBuscarCliente">Buscar</button>
                                    </div>
                                </div>
                                <div class="col-md-8">
                                    <div id="ControlEstado" class="mt-2 text-md-start"></div>
                                </div>
                            </div>
                        </div>
                        <hr class="border-secondary">

                        <div class="col-md-4">
                            <label class="form-label-enhanced">Marca</label>
                            <select id="SelectMarcas" class="form-select">
                                <option value="0">Seleccione...</option>
                                <option value="Audi">Audi</option>
                                <option value="BMW">BMW</option>
                                <option value="Chevrolet">Chevrolet</option>
                                <option value="Citroën">Citroën</option>
                                <option value="Dodge">Dodge</option>
                                <option value="Fiat">Fiat</option>
                                <option value="Ford">Ford</option>
                                <option value="Honda">Honda</option>
                                <option value="Hyundai">Hyundai</option>
                                <option value="Jeep">Jeep</option>
                                <option value="Kia">Kia</option>
                                <option value="Mazda">Mazda</option>
                                <option value="Mercedes-Benz">Mercedes-Benz</option>
                                <option value="Mitsubishi">Mitsubishi</option>
                                <option value="Nissan">Nissan</option>
                                <option value="Peugeot">Peugeot</option>
                                <option value="Renault">Renault</option>
                                <option value="Seat">Seat</option>
                                <option value="Subaru">Subaru</option>
                                <option value="Suzuki">Suzuki</option>
                                <option value="Toyota">Toyota</option>
                                <option value="Volkswagen">Volkswagen</option>
                                <option value="Volvo">Volvo</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label-enhanced">Modelo</label>
                            <input type="text" class="form-control" id="InputModelo">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label-enhanced">Año</label>
                            <input type="number" class="form-control" id="InputAño">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label-enhanced">Propietario</label>
                            <input type="text" class="form-control" id="InputNombre">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label-enhanced">Teléfono</label>
                            <input type="text" class="form-control" id="InputTelefono">
                        </div>

                        <div class="col-12 text-end mt-4">
                            <button type="button" class="btn-finance btn-finance-success" id="BtnGuardarCliente"><i class="bi bi-save me-1"></i> Guardar Cliente</button>
                            <button type="button" class="btn-finance btn-finance-warning" id="BtnEditarCliente"><i class="bi bi-pencil me-1"></i> Editar</button>
                            <button type="button" class="btn-finance btn-finance-danger" id="BtnEliminarCliente"><i class="bi bi-trash me-1"></i> Eliminar</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row g-4 mt-2">
                <div class="col-lg-4">
                    <div class="finance-card h-100">
                        <div class="finance-card-header text-primary"><h6><i class="bi bi-tools me-2"></i>Servicios</h6></div>
                        <div class="p-3">
                            <form id="FormIngresoServicios" class="d-flex gap-2 mb-3">
                                <input type="text" class="form-control form-control-sm" placeholder="Descripción" id="inputServiciosDescripcion">
                                <input type="number" class="form-control form-control-sm" style="width: 80px;" placeholder="$" id="inputServiciosValor">
                                <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-plus"></i></button>
                            </form>
                            <table class="finance-table"><tbody id="TablaServicios"></tbody></table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="finance-card h-100">
                        <div class="finance-card-header text-warning"><h6><i class="bi bi-gear me-2"></i>Repuestos</h6></div>
                        <div class="p-3">
                            <form id="FormIngresoRepuestos" class="d-flex gap-2 mb-3">
                                <input type="text" class="form-control form-control-sm" placeholder="Descripción" id="inputRepuestosDescripcion">
                                <input type="number" class="form-control form-control-sm" style="width: 80px;" placeholder="$" id="inputRepuestosValor">
                                <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-plus"></i></button>
                            </form>
                            <table class="finance-table"><tbody id="TablaRepuestos"></tbody></table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="finance-card h-100">
                        <div class="finance-card-header text-info"><h6><i class="bi bi-droplet me-2"></i>Insumos</h6></div>
                        <div class="p-3">
                            <form id="FormIngresoInsumos" class="d-flex gap-2 mb-3">
                                <input type="text" class="form-control form-control-sm" placeholder="Descripción" id="inputInsumosDescripcion">
                                <input type="number" class="form-control form-control-sm" style="width: 80px;" placeholder="$" id="inputInsumosValor">
                                <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-plus"></i></button>
                            </form>
                            <table class="finance-table"><tbody id="TablaInsumos"></tbody></table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="finance-card mt-4 border-primary">
                <div class="card-body-main">
                    <div class="totales-grid">
                        <div class="total-item">
                            <h5>Servicios</h5>
                            <span class="text-primary" id="totalServicios">0</span>
                        </div>
                        <div class="total-item">
                            <h5>Repuestos</h5>
                            <span class="text-warning" id="Total Repuestos">0</span>
                        </div>
                        <div class="total-item">
                            <h5>Insumos</h5>
                            <span class="text-info" id="Total Insumos">0</span>
                        </div>
                        <div class="total-item total-general">
                            <h5>TOTAL ESTIMADO</h5>
                            <span class="text-success" id="total">0</span>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <button class="btn-finance btn-finance-success px-5" id="BtnGuardarControl">
                            <i class="bi bi-save me-2"></i> Guardar Control
                        </button>
                        <button class="btn-finance btn-finance-primary px-5" id="BtnGenerarFactura">
                            <i class="bi bi-receipt me-2"></i> Convertir a Factura
                        </button>
                    </div>
                </div>
            </div>

            <div class="finance-card mt-5">
                <div class="finance-card-header">
                    <h3><i class="bi bi-clock-history me-2"></i>Historial Reciente</h3>
                </div>
                <div class="p-0">
                    <table class="finance-table table-hover">
                        <thead>
                            <tr>
                                <th>Placa</th>
                                <th>Cliente</th>
                                <th>Vehículo</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaControles"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "index.html";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./JS/control.js"></script>
    <script type="module" src="./JS/helpers/logout.js"></script>
</body>
</html>

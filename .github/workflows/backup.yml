name: Respaldo Diario Base de Datos

on:
  schedule:
    - cron: '0 3 * * *' # 3:00 AM UTC
  workflow_dispatch:

jobs:
  backup_and_upload:
    runs-on: ubuntu-latest
    name: Crear Dump y Subir a Drive
    
    steps:
      - name: Instalar Cliente PostgreSQL 18
        run: |
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Crear Respaldo SQL
        env:
          PG_DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          FILE_NAME="backup_$(date +%Y-%m-%d_%H-%M).sql"
          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
          pg_dump "$PG_DB_URL" > "$FILE_NAME"
          echo "✅ Respaldo creado: $FILE_NAME"

      # --- AQUÍ ESTÁ EL CAMBIO IMPORTANTE ---
      - name: Instalar y Configurar Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONF }}

      - name: Subir a Google Drive
        run: |
          # 'gdrive' debe coincidir con el nombre que pusiste en 'rclone config'
          # 'Backups_BaseDatos' es la carpeta en tu Drive (si tiene espacios, usa comillas)
          rclone copy "$FILE_NAME" "gdrive:Backups_BaseDatos"
          echo "🚀 Subida completada con éxito"